<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="100%" role="img" aria-labelledby="d5-title d5-desc">
    <title id="d5-title">The Silent Assumption Trap: Causal Pathway of Contextual AI Failure</title>
    <desc id="d5-desc">Step-by-step causal chain showing how incomplete financial prompts lead LLMs to silently hallucinate default risk constraints and generate hazardous responses.</desc>
    
    <defs>
        <style>
            .node { fill: #09090b; stroke: #27272a; stroke-width: 1; }
            .node-warn { fill: #1c0808; stroke: #991b1b; stroke-width: 1.5; }
            .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #a1a1aa; }
            .tag-warn { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #f87171; }
            .title { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 600; fill: #f4f4f5; }
            .desc { font-family: 'Inter', sans-serif; font-size: 10px; fill: #d4d4d8; }
            .arrow { stroke: #27272a; stroke-width: 1.5; fill: none; }
        </style>
    </defs>

    <!-- Step 1 -->
    <g transform="translate(10, 20)">
        <rect class="node" width="170" height="140" rx="2"/>
        <text x="12" y="26" class="tag">STEP 01</text>
        <text x="12" y="50" class="title">Incomplete Mandate</text>
        <text x="12" y="74" class="desc">Prompt lacks explicit</text>
        <text x="12" y="90" class="desc">horizon, loss hurdle,</text>
        <text x="12" y="106" class="desc">or liquidity constraints</text>
    </g>

    <path d="M 185 90 L 205 90" class="arrow"/>
    <polygon points="205,87 210,90 205,93" fill="#991b1b"/>

    <!-- Step 2 -->
    <g transform="translate(210, 20)">
        <rect class="node-warn" width="170" height="140" rx="2"/>
        <text x="12" y="26" class="tag-warn">STEP 02 · BLIND SPOT</text>
        <text x="12" y="50" class="title" style="fill: #f87171;">Unrecognized Gap</text>
        <text x="12" y="74" class="desc" style="fill: #fca5a5;">LLM fails to detect</text>
        <text x="12" y="90" class="desc" style="fill: #fca5a5;">that crucial decision</text>
        <text x="12" y="106" class="desc" style="fill: #fca5a5;">hurdles are missing</text>
    </g>

    <path d="M 385 90 L 405 90" class="arrow"/>
    <polygon points="405,87 410,90 405,93" fill="#991b1b"/>

    <!-- Step 3 -->
    <g transform="translate(410, 20)">
        <rect class="node-warn" width="170" height="140" rx="2"/>
        <text x="12" y="26" class="tag-warn">STEP 03 · FAILURE</text>
        <text x="12" y="50" class="title" style="fill: #f87171;">Silent Assumption</text>
        <text x="12" y="74" class="desc" style="fill: #fca5a5;">Statistical pattern</text>
        <text x="12" y="90" class="desc" style="fill: #fca5a5;">completion inserts</text>
        <text x="12" y="106" class="desc" style="fill: #fca5a5;">unverified defaults</text>
    </g>

    <path d="M 585 90 L 605 90" class="arrow"/>
    <polygon points="605,87 610,90 605,93" fill="#991b1b"/>

    <!-- Step 4 -->
    <g transform="translate(610, 20)">
        <rect class="node" width="175" height="140" rx="2" style="stroke: #991b1b;"/>
        <text x="12" y="26" class="tag-warn">STEP 04 · OUTCOME</text>
        <text x="12" y="50" class="title">Hazardous Analysis</text>
        <text x="12" y="74" class="desc">Grammatically flawless</text>
        <text x="12" y="90" class="desc">text that violates</text>
        <text x="12" y="106" class="desc">institutional mandate</text>
    </g>
</svg>
